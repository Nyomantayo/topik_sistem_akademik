<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profil Saya — KRS Akademik</title>
  <link rel="stylesheet" href="https://bootswatch.com/5/brite/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/izitoast@1.4.0/dist/css/iziToast.min.css" />
  <style>
    body { background: #f4f6fb; }
    .avatar-sm { width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.25);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#fff; }
    .profile-avatar { width:80px;height:80px;border-radius:50%;background:var(--bs-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;flex-shrink:0; }
    .info-row { display:flex;padding:.6rem 0;border-bottom:1px solid #f1f5f9; }
    .info-row:last-child { border-bottom:none; }
    .info-label { min-width:130px;color:#64748b;font-size:.85rem; }
    .info-value { font-weight:600;font-size:.9rem; }
    .akademik-card { background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #bfdbfe;border-radius:16px;padding:1.5rem; }
    .dosen-pa-card { background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:1rem; }
    .dosen-pa-avatar { width:48px;height:48px;border-radius:50%;background:#dcfce7;color:#15803d;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;flex-shrink:0; }
    .nim-badge { font-family:monospace;background:#f1f5f9;padding:2px 7px;border-radius:4px;font-size:.82rem;border:1px solid #e2e8f0; }
    .badge-smt { background:#dbeafe;color:#1d4ed8;padding:2px 8px;border-radius:12px;font-size:.75rem;font-weight:600; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="dashboard.html"><i class="fas fa-graduation-cap me-2"></i>KRS Akademik</a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item no-guest"><a class="nav-link" href="dashboard.html" data-page="dashboard.html"><i class="fas fa-tachometer-alt me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="mahasiswa.html" data-page="mahasiswa.html"><i class="fas fa-user-graduate me-1"></i>Mahasiswa</a></li>
        <li class="nav-item"><a class="nav-link" href="dosen.html" data-page="dosen.html"><i class="fas fa-chalkboard-teacher me-1"></i>Dosen</a></li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" data-bs-toggle="dropdown">
            <span class="avatar-sm"><span class="user-avatar-initials">A</span></span>
            <span class="d-none d-md-inline user-display-name">User</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end shadow border-0">
            <li><h6 class="dropdown-header user-display-name fw-bold"></h6></li>
            <li><span class="dropdown-item-text text-muted small user-display-role"></span></li>
            <li><hr class="dropdown-divider"></li>
            <li class="no-guest"><a class="dropdown-item active" href="profile.html"><i class="fas fa-user me-2 text-muted"></i>Profil Saya</a></li>
            <li><hr class="dropdown-divider no-guest"></li>
            <li><a class="dropdown-item text-danger" href="#" onclick="Auth.logout();return false;"><i class="fas fa-sign-out-alt me-2"></i>Keluar</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4" style="max-width:860px;">
  <div class="mb-4">
    <h4 class="fw-bold mb-0">Profil Saya</h4>
    <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0 small">
      <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
      <li class="breadcrumb-item active">Profil</li>
    </ol></nav>
  </div>

  <!-- Akun Info -->
  <div class="card border-0 shadow-sm rounded-4 mb-4">
    <div class="card-body p-4">
      <div id="profileHeader" class="d-flex align-items-center gap-4 mb-4">
        <div class="placeholder-glow"><div class="placeholder rounded-circle" style="width:80px;height:80px;"></div></div>
        <div class="placeholder-glow flex-fill">
          <p class="placeholder col-5 mb-1 rounded"></p>
          <p class="placeholder col-3 rounded small"></p>
        </div>
      </div>
      <div id="profileInfo">
        <div class="placeholder-glow">
          <p class="placeholder col-12 mb-2 rounded"></p>
          <p class="placeholder col-10 mb-2 rounded"></p>
          <p class="placeholder col-8 rounded"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Kartu Akademik (mahasiswa only) -->
  <div id="sectionAkademik" style="display:none;">
    <div class="akademik-card mb-4">
      <h6 class="fw-bold text-primary mb-3"><i class="fas fa-id-card me-2"></i>Data Akademik</h6>
      <div id="akademikContent">
        <div class="text-center py-3"><div class="spinner-border text-primary"></div></div>
      </div>
    </div>
  </div>

  <!-- Ganti Password -->
  <div class="card border-0 shadow-sm rounded-4">
    <div class="card-header bg-transparent border-0 pt-3">
      <h6 class="fw-bold mb-0"><i class="fas fa-lock me-2 text-warning"></i>Ganti Password</h6>
    </div>
    <div class="card-body p-4">
      <div class="row g-3" style="max-width:500px;">
        <div class="col-12">
          <label class="form-label fw-semibold">Password Lama <span class="text-danger">*</span></label>
          <input type="password" class="form-control" id="fPassLama" placeholder="Password saat ini" />
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Password Baru <span class="text-danger">*</span></label>
          <input type="password" class="form-control" id="fPassBaru" placeholder="Minimal 6 karakter" />
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Konfirmasi Password Baru <span class="text-danger">*</span></label>
          <input type="password" class="form-control" id="fPassKonfirmasi" placeholder="Ulangi password baru" />
        </div>
        <div class="col-12">
          <button class="btn btn-warning" id="btnGantiPass"><i class="fas fa-key me-1"></i>Ganti Password</button>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="text-center py-3 text-muted small border-top mt-4">© 2025 KRS Akademik &middot; Universitas Udayana</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/izitoast@1.4.0/dist/js/iziToast.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
