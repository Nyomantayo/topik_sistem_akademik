<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daftar — KRS Akademik</title>
  <link rel="stylesheet" href="https://bootswatch.com/5/brite/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/izitoast@1.4.0/dist/css/iziToast.min.css" />
  <style>
    body { background: linear-gradient(135deg, #1e3a5f 0%, #3730a3 100%); min-height: 100vh; display: flex; align-items: center; }
    .login-card { max-width: 440px; width: 100%; margin: auto; }
    .brand-icon { width: 56px; height: 56px; border-radius: 16px; background: #4f46e5; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
<div class="container py-5">
  <div class="login-card">

    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-3">
        <i class="fas fa-graduation-cap fa-lg text-white"></i>
      </div>
      <h3 class="fw-bold text-white mb-1">Buat Akun Baru</h3>
      <p class="text-white-50 small">Bergabung dan kelola kegiatan akademik Anda</p>
    </div>

    <div class="card shadow-lg border-0 rounded-4">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-1">Daftar Sekarang ✨</h5>
        <p class="text-muted small mb-4">Lengkapi data berikut untuk membuat akun</p>

        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">Nama Lengkap</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
              <input type="text" id="name" class="form-control" placeholder="Nama lengkap Anda" autocomplete="name" />
            </div>
            <div class="text-danger small mt-1 d-none" id="nameError"></div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
              <input type="email" id="email" class="form-control" placeholder="email@domain.com" autocomplete="email" />
            </div>
            <div class="text-danger small mt-1 d-none" id="emailError"></div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
              <input type="password" id="password" class="form-control" placeholder="Min. 8 karakter" autocomplete="new-password" />
              <button class="btn btn-outline-secondary" type="button" id="togglePass" tabindex="-1">
                <i class="fas fa-eye" id="togglePassIcon"></i>
              </button>
            </div>
            <div class="text-danger small mt-1 d-none" id="passwordError"></div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Daftar sebagai</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-id-badge text-muted"></i></span>
              <select id="role" class="form-select">
                <option value="mahasiswa">Mahasiswa</option>
                <option value="dosen">Dosen</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 fw-semibold" id="btnRegister">
            <i class="fas fa-user-plus me-2"></i>Daftar Sekarang
          </button>
        </form>

        <p class="text-center small mt-3 mb-0">
          Sudah punya akun? <a href="login.html" class="fw-semibold">Masuk di sini</a>
        </p>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/izitoast@1.4.0/dist/js/iziToast.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  Auth.requireNoAuth();

  document.getElementById('togglePass').addEventListener('click', () => {
    const inp  = document.getElementById('password');
    const icon = document.getElementById('togglePassIcon');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    icon.classList.toggle('fa-eye');
    icon.classList.toggle('fa-eye-slash');
  });

  const showErr = (id, msg) => {
    const el = document.getElementById(id);
    if (msg) { el.textContent = msg; el.classList.remove('d-none'); }
    else      { el.textContent = ''; el.classList.add('d-none'); }
  };

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const role = document.getElementById('role').value;

    ['nameError','emailError','passwordError'].forEach(id => showErr(id, ''));
    let valid = true;
    if (!name) { showErr('nameError', 'Nama wajib diisi'); valid = false; }
    if (!email) { showErr('emailError', 'Email wajib diisi'); valid = false; }
    if (!password) { showErr('passwordError', 'Password wajib diisi'); valid = false; }
    else if (password.length < 8) { showErr('passwordError', 'Password minimal 8 karakter'); valid = false; }
    if (!valid) return;

    const btn = document.getElementById('btnRegister');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Memproses...';
    try {
      const res = await api.post('/auth/register', { name, email, password, role });
      Auth.setSession(res.data.token, res.data.user);
      window.location.href = 'dashboard.html';
    } catch (err) {
      iziToast.error({ message: err.message || 'Pendaftaran gagal', position: 'topRight' });
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-user-plus me-2"></i>Daftar Sekarang';
    }
  });
</script>
</body>
</html>
